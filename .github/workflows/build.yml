name: Build LightMirror

permissions:
  contents: read

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64 -DLIGHTMIRROR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build\Release\LightMirror.exe artifact\LightMirror.exe
          Copy-Item README.md artifact\README.md
          Get-FileHash artifact\LightMirror.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  LightMirror.exe" } |
            Set-Content artifact\SHA256SUMS.txt

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LightMirror-windows-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
