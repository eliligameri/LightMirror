name: Build LightMirror App

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract complete source
        shell: pwsh
        run: Expand-Archive -LiteralPath LightMirror-ready-repo.zip -DestinationPath source -Force

      - name: Configure x64 Release
        run: cmake -S source/LightMirror -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build\Release\LightMirror.exe artifact\LightMirror.exe
          Copy-Item source\LightMirror\README.md artifact\README.md

      - name: Upload LightMirror
        uses: actions/upload-artifact@v4
        with:
          name: LightMirror-windows-x64
          path: artifact/
          if-no-files-found: error
